services:
  elasticsearch:
    build:
      context: ./infra/elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 50s

  feed:
    build:
      context: ./services/feed
      dockerfile: Dockerfile.dev
    environment:
      ES_HOST: http://elasticsearch:9200
      HTTP_ADDR: :8080
      ZENN_FEED_URL: https://zenn.dev/feed
    volumes:
      - ./services/feed:/src
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    environment:
      FEED_API_URL: http://feed:8080
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      feed:
        condition: service_healthy

volumes:
  es_data:
  web_node_modules:
