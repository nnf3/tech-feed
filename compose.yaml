services:
  elasticsearch:
    build:
      context: ./infra/elasticsearch
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 50s

  feed:
    build:
      context: ./services/feed
      dockerfile: Dockerfile.dev
    environment:
      ES_HOST: http://elasticsearch:9200
      HTTP_ADDR: :8080
      ZENN_FEED_URL: https://zenn.dev/feed
    volumes:
      - ./services/feed:/src
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    depends_on:
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: techfeed
      POSTGRES_PASSWORD: techfeed
      POSTGRES_DB: techfeed
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U techfeed -d techfeed"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile.dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      FEED_API_URL: http://feed:8080
      DATABASE_URL: postgres://techfeed:techfeed@postgres:5432/techfeed
      AUTH_SECRET: local-tech-feed-auth-secret-change-me
      OIDC_CLIENT_ID: tech-feed-web
      OIDC_REDIRECT_URI: http://127.0.0.1:3001/callback
      OIDC_ISSUER: http://127.0.0.1:4444
      OIDC_AUTH_URL: http://127.0.0.1:4444/oauth2/auth
      OIDC_TOKEN_URL: http://host.docker.internal:4444/oauth2/token
      OIDC_JWKS_URL: http://host.docker.internal:4444/.well-known/jwks.json
      IDP_SETTINGS_URL: http://127.0.0.1:4455/settings
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "3001:3000"
    depends_on:
      feed:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  es_data:
  web_node_modules:
  pg_data:
